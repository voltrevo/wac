name: Pages

# One site for the repository: wac's at the root, and every other project with a tools/pages.sh under /<name>/
# (the desktop at /desktop/). Each site builds in a job of its own, with the wac its project pins. **A site whose
# build fails keeps its last good build** — the newest earlier `site-<name>` artifact — so one project's broken
# build neither takes down another's site nor publishes something broken.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sites:
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          list=$(ls projects | while read -r p; do if [ -f "projects/$p/tools/pages.sh" ]; then echo "$p"; fi; done)
          echo "projects=$(printf '%s\n' $list | jq -R . | jq -cs 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  site:
    needs: sites
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.sites.outputs.projects) }}
    runs-on: ubuntu-24.04
    name: site ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: pin
        run: |
          p=projects/${{ matrix.project }}
          c=""
          if [ -f "$p/wac.lock" ]; then c=$(tr '\n' ' ' < "$p/wac.lock" | sed -n 's/.*"wac" *: *{[^}]*"commit" *: *"\([0-9a-f]\{40\}\)".*/\1/p'); fi
          echo "commit=$c" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/wac
        with:
          commit: ${{ steps.pin.outputs.commit }}
      # What the project's lock pins, as ci.yml fills it: a pages.sh may build with any of it.
      - name: Fill the package cache
        run: |
          [ -f projects/${{ matrix.project }}/wac.lock ] || exit 0
          sh projects/repo/tools/fill-cache.sh projects/${{ matrix.project }}/wac.lock
      - name: tools/pages.sh
        run: |
          set -o pipefail
          if ! sh projects/${{ matrix.project }}/tools/pages.sh "$RUNNER_TEMP/site" 2>&1 | tee "$RUNNER_TEMP/pages.log"; then
            echo "::error title=${{ matrix.project }}'s site did not build::$(tail -n 20 "$RUNNER_TEMP/pages.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
        env:
          WAC_HOST: deno
          BASE_URL: /${{ github.event.repository.name }}/${{ matrix.project != 'wac' && format('{0}/', matrix.project) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.project }}
          path: ${{ runner.temp }}/site
          include-hidden-files: true

  # Assembling and deploying are separate jobs on purpose. deploy-pages looks the `github-pages` artifact up by
  # name, and the listing can lag the upload by seconds, so a deploy step straight after the upload step finds
  # nothing (actions/deploy-pages#451; it failed three runs in a row here on 2026-11-25). A job boundary gives the
  # listing time to catch up, and a re-run of a failed deploy no longer uploads a second artifact of that name.
  assemble:
    needs: [sites, site]
    if: always() && needs.sites.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Assemble, with last good builds for any that failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROJECTS: ${{ needs.sites.outputs.projects }}
        run: |
          set -eu
          mkdir -p out
          for p in $(echo "$PROJECTS" | jq -r '.[]'); do
            d="built/site-$p"
            if [ ! -d "$d" ]; then
              id=$(gh api "repos/$REPO/actions/artifacts?name=site-$p&per_page=1" --jq '.artifacts[0].id // empty')
              if [ -z "$id" ]; then echo "::warning::$p's site did not build and has no earlier build; left out"; continue; fi
              echo "::warning::$p's site did not build; publishing its last good build (artifact $id)"
              mkdir -p "$d" && gh api "repos/$REPO/actions/artifacts/$id/zip" > "$p.zip" && unzip -q "$p.zip" -d "$d"
            fi
            if [ "$p" = wac ]; then cp -R "$d/." out/; else mkdir -p "out/$p" && cp -R "$d/." "out/$p/"; fi
          done
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
