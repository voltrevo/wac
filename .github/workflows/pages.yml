name: Deploy to GitHub Pages

# The demos are built here, from source, on every deploy.
#
# They are whole wac applications — `site/public/*.html`, each a self-contained page with the wasm
# inside it — built from `packages/box` and `packages/platform`. They used to be committed: a
# megabyte of generated HTML in git, refreshed whenever somebody remembered, which is to say
# usually stale.
#
# This used to check out two repositories side by side, because the packages and the compiler lived
# apart and the import map pointed at a sibling checkout. They are one repository now, so the two
# sync steps take no path and every step runs from the root.
#
# **A demo that will not build fails the deploy.** A site that advertises three demos and serves
# three 404s is worse than a site that did not deploy.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The demos are build output from `packages/box` and `packages/platform`, not source, so they
      # are built here rather than committed — a megabyte of generated HTML in git was stale by the
      # next day. Both of these used to take the path of a sibling checkout; the merge made them
      # local.
      - name: Build the demos
        run: deno run -A site/tools/syncDemos.ts
      # The compiler as a file the page can import: reference-built (that is the bootstrap) with wacc's
      # own bindgen writing the JavaScript. Build output like the demos, and for the same reason.
      # `--import-map` is load-bearing: `site/package.json` puts this subtree in an npm resolution
      # scope, so the bare `wac/` specifier in `harness/wacFiles.ts` — which only this script reaches
      # — resolves as an npm package and fails with `Import "wac/wacLex.ts" not a dependency`.
      # Without the flag this step fails, no `wacc-api.js` is written, and the playground falls back
      # to the reference compiler in production without saying so. See `issues/system/0146`.
      - name: Build the wacc asset
        run: deno run -A --import-map deno.json site/tools/syncWacc.ts
      # `site/src/data/built.ts` is committed so a checkout can build the site without running this,
      # but the numbers in it go stale the same way the demos used to. Refresh them: the committed
      # copy is the fallback, not the source.
      - name: Refresh the package table from MAP.md
        run: deno run -A site/tools/syncMap.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npx tsc -b
      - working-directory: site
        run: BASE_URL="/${{ github.event.repository.name }}/" npx vite build
      # After the build, because one of these talks to the *emitted* worker chunk rather than to
      # the TypeScript. The rest compile and run every snippet the page shows, which is the same
      # reasoning as building the demos here: a page that advertises working code and serves
      # broken code is worse than a page that did not deploy.
      - name: Check the site's own code
        run: deno test -A --unstable-sloppy-imports --no-check site/tools/site.test.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
