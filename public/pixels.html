    write: raw,
    root,
    writable: false,
    dom: pageDom(document.getElementById("app"), document, (name, bytes) => {
      const url = URL.createObjectURL(new Blob([
        bytes
      ]));
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1e4);
    })
  });
  line("[exit " + code + "]", "meta");
} catch (e) {
  line(String(e && e.message ? e.message : e), "warn");
}

</script>
