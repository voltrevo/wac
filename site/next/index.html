<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- This site was built here while it replaced the one at the root, and the URL was shared
         while that was true. It is the root now, so this exists only so that a link somebody kept
         still arrives — including its `#/route/anchor`, which the redirect carries across because
         a fragment is not sent to a server and has to be moved by hand. -->
    <title>wac — moved to the root</title>
    <meta name="robots" content="noindex" />
    <script>
      location.replace("../" + location.hash);
    </script>
  </head>
  <body style="margin: 0; background: #0a0b0e; color: #8b95a5; font: 14px ui-monospace, monospace">
    <p style="padding: 24px">
      This moved to <a href="../index.html" style="color: #5eead4">the root of the site</a>.
    </p>
  </body>
</html>
