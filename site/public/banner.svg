<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400"
     role="img" aria-label="wac — a C-family language for WebAssembly GC, and the systems stack written in it">
  <title>wac</title>

  <!-- The site's own palette: near-black ground, hairlines rather than panels, one accent.
       Deliberately no gradient and no glow — site/src/next/tokens.ts calls the look a spec sheet,
       and a banner that fronted it with atmosphere would be the one thing on the page doing that. -->
  <rect width="1160" height="400" fill="#0a0b0e"/>

  <!-- Fonts are named the way the site names them, ending in the generic `monospace` so a renderer
       that has none of the others still gets the right shape. Nothing here is loaded from anywhere:
       an SVG in a README is rendered without network access, so a webfont would silently fall back. -->
  <g font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Code&quot;, &quot;JetBrains Mono&quot;, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">

    <!-- The wordmark, as `Wordmark` in site/src/next/ui.tsx renders it: bold, tight tracking,
         and the underscore in the accent — a cursor rather than a punctuation mark. -->
    <text x="88" y="160" font-size="92" font-weight="700" letter-spacing="-2.8" fill="#e8eaed">wac<tspan fill="#5eead4">_</tspan></text>

    <!-- The line the README and the site's own description both open with, so the three agree. -->
    <text x="92" y="224" font-size="25" fill="#8b95a5">A C-family language for WebAssembly GC,</text>
    <text x="92" y="258" font-size="25" fill="#8b95a5">and the systems stack written in it.</text>

    <rect x="92" y="300" width="976" height="1" fill="#1f242e"/>

    <!-- Facts, in monospace because they are facts — the same three the front page leads with.
         Structural rather than counted, and deliberately: these are invariants somebody would have
         to decide to break, where a line total or a test total drifts on its own and would rot here
         with nothing checking it. "It compiles itself" was the third and is not here, because it is
         true only with the caveat the front page carries — wacc reaches a fixpoint, and the
         self-hosted compiler is still not the one that builds this repository. -->
    <text x="92" y="350" font-size="21" fill="#5e6878">dependencies <tspan fill="#e8eaed" font-weight="700">0</tspan></text>
    <text x="374" y="350" font-size="21" fill="#5e6878">TypeScript in the packages <tspan fill="#e8eaed" font-weight="700">0</tspan></text>
    <text x="836" y="350" font-size="21" fill="#5e6878">LLVM, binaryen <tspan fill="#e8eaed" font-weight="700">0</tspan></text>
  </g>
</svg>
