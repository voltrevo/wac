    <title>wac — a C-family language for WebAssembly GC</title>
    <meta name="description" content="A C-family language for WebAssembly GC. Structs, generics, enums with payloads; a compiler in ~6k lines of TypeScript with no LLVM and nothing to install; and two dozen packages written in it, including TLS 1.3 and a Tor client." />
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <!-- Cross-origin isolation, without control of the response headers.
         `SharedArrayBuffer` needs COOP/COEP, and GitHub Pages cannot set them — so this
         registers a service worker that re-serves the site with those headers and reloads
         once. That is what lets the capability demos on this site work at all: a wac
         application runs on a worker that parks on `Atomics.wait`, which needs a SAB.
         Vendored verbatim from gzuidhof/coi-serviceworker v0.1.7 (MIT) — a classic script
         on purpose, because it registers itself via `document.currentScript.src`, which is
         null in a module. -->
    <script src="coi-serviceworker.js"></script>
  </head>
  <body style="margin: 0; background: #11111b;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
